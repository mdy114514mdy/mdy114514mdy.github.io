<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="description" content="mdy 的个人主页">
<title>mdy</title>
<style>
/* ===== 基础变量（现代浏览器生效，老浏览器忽略） ===== */
:root {
  --primaryColor: #326182;
  --backgroundLight: #FAFAFB;
  --backgroundMiddle: #f5f5f5;
  --backgroundMain: #DEE2E6;
  --textDark: #2C2F33;
  --dividerColor: #E9ECEF;
  --headerBarColor: #C8DBE8;        /* 由原半透明色与底色混合算出的不透明近似值 */
  --borderRadius: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

/* ===== 基础样式：所有浏览器都能懂 ===== */
body {
  background: #DEE2E6;
  color: #2C2F33;
  font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh;
}

/* ===== 动态背景层 ===== */
#bg-layer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -2;
  overflow: hidden;
  background: linear-gradient(135deg, #DEE2E6 0%, #C8DBE8 100%);
}
#bg-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.8s ease;
}
#bg-image.loaded {
  opacity: 1;
}
#bg-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255, 255, 255, 0.72);
  transition: background 0.3s ease;
}
body.dark #bg-overlay {
  background: rgba(0, 0, 0, 0.62);
}

/* 背景加载指示器 */
#bg-loader {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 20;
  font-size: 13px;
  color: #666;
  background: rgba(255,255,255,0.85);
  padding: 8px 18px;
  border-radius: 20px;
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
}
#bg-loader.show { opacity: 1; }
body.dark #bg-loader { background: rgba(0,0,0,0.7); color: #ccc; }

/* 背景刷新按钮 */
.bg-refresh-btn {
  float: left;
  margin-left: 12px;
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 6px;
  border-radius: 50%;
  font-size: 14px;
  line-height: 20px;
  opacity: 0.7;
  transition: opacity 0.2s, transform 0.4s;
}
.bg-refresh-btn:hover { opacity: 1; transform: rotate(180deg); }

/* 顶栏：纯色，无毛玻璃，无实时合成 */
.headerBar {
  padding: 12px 24px;
  background: #C8DBE8;
  position: fixed;                  /* 比 sticky 便宜，且不随内容重算 */
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  overflow: hidden;
}
.headerBar .logo {
  float: left;
  font-size: 18px;
  font-weight: bold;
  letter-spacing: 1px;
  line-height: 32px;
}
.headerBar .themeBtn {
  float: right;
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 6px;
  border-radius: 50%;
  font-size: 16px;
  line-height: 20px;
}
.headerBar .themeBtn:hover { background: rgba(0,0,0,0.08); }
.headerBar::after { content: ""; display: block; clear: both; }

/* 给固定顶栏留出空间，避免内容被遮住 */
.page {
  padding-top: 56px;
}

/* Hero */
.hero {
  text-align: center;
  padding: 80px 20px 60px;
}
.hero h1 { font-size: 36px; margin-bottom: 12px; text-shadow: 0 1px 3px rgba(255,255,255,0.8); }
body.dark .hero h1 { text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
.hero p { color: #666; font-size: 16px; }

/* 卡片区：老浏览器 inline-block 居中，现代浏览器 flex */
.cards {
  text-align: center;
  padding: 20px 40px 60px;
  max-width: 1000px;
  margin: 0 auto;
  font-size: 0;
}
.card {
  display: inline-block;
  vertical-align: top;
  text-align: left;
  background: #FAFAFB;
  border: 1px solid #E9ECEF;        /* 用边框替代阴影，零模糊开销 */
  border-radius: 8px;
  padding: 24px;
  width: 240px;
  max-width: 100%;
  margin: 10px;
  font-size: 14px;
  transition: transform 0.2s;       /* 只保留便宜的 transform 过渡 */
}
.card:hover { transform: translateY(-4px); }
.card h3 { margin-bottom: 8px; color: #326182; }
.card p { font-size: 14px; color: #555; line-height: 1.6; }
.card a { color: #326182; text-decoration: none; }
.card a:hover { text-decoration: underline; }

/* 友链 */
.friendLinks {
  text-align: center;
  padding: 20px 20px 0;
  font-size: 14px;
  color: #666;
}
.friendLinks a {
  color: #326182;
  text-decoration: none;
  border-bottom: 1px dashed #326182;
}
.friendLinks a:hover { opacity: 0.75; }

/* 页脚 */
.footer {
  text-align: center;
  padding: 30px;
  color: #888;
  font-size: 13px;
  border-top: 1px solid #E9ECEF;
  margin-top: 20px;
}

/* 升级提示条：只在 IE8 及以下显示 */
.ie-warning {
  display: none;
  background: #ffe0e0;
  color: #900;
  text-align: center;
  padding: 12px;
  font-size: 14px;
}

/* ===== 现代浏览器增强 ===== */
@supports (display: flex) {
  .headerBar {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .headerBar .logo,
  .headerBar .themeBtn { float: none; }
  .headerBar::after { display: none; }

  .cards {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    font-size: 14px;
  }
  .card { margin: 0; }
}

/* ===== 暗色主题：变量生效的浏览器才有 ===== */
@supports (--css: variables) {
  body {
    background: var(--backgroundMain);
    color: var(--textDark);
  }
  .headerBar { background: var(--headerBarColor); }
  .card {
    background: var(--backgroundLight);
    border-radius: var(--borderRadius);
  }
  .card h3, .card a { color: var(--primaryColor); }
  .friendLinks a { color: var(--primaryColor); border-bottom-color: var(--primaryColor); }
  .footer { border-top-color: var(--dividerColor); }

  body.dark {
    --primaryColor: #7FB3D5;
    --backgroundMain: #111111;
    --backgroundMiddle: #1a1a1a;
    --backgroundLight: #282828;
    --textDark: #FFFFFF;
    --headerBarColor: #0B2A6B;
    --dividerColor: #404040;
  }
  body.dark .hero p,
  body.dark .card p { color: #aaa; }
  body.dark .friendLinks { color: #aaa; }
  body.dark .footer { color: #666; }
}

/* ===== 访客计数器 ===== */
.visitor-counter {
  margin-top: 20px;
  padding: 10px 20px;
  display: inline-flex;
  align-items: center;
  gap: 18px;
  background: var(--backgroundLight);
  border: 1px solid var(--dividerColor);
  border-radius: 20px;
  font-size: 13px;
  color: #666;
}
.visitor-counter .item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.visitor-counter .icon { font-size: 16px; }
.visitor-counter .num {
  font-weight: bold;
  font-size: 15px;
  color: var(--primaryColor);
  min-width: 20px;
  text-align: center;
}
.visitor-counter .divider {
  width: 1px;
  height: 16px;
  background: var(--dividerColor);
}
.visitor-counter .global-badge {
  height: 20px;
  width: auto;
  border-radius: 3px;
  vertical-align: middle;
}
body.dark .visitor-counter { background: #282828; border-color: #404040; }
body.dark .visitor-counter .num { color: #7FB3D5; }
body.dark .visitor-counter .global-badge { filter: invert(0.85) hue-rotate(180deg); }

/* 页脚 */
.footer { display: flex; align-items: center; justify-content: center; gap: 16px; }

/* ===== 新增：小功能样式 ===== */

/* 打字机光标 */
.typing-cursor {
  display: inline-block;
  width: 2px;
  height: 1em;
  background: currentColor;
  margin-left: 2px;
  vertical-align: text-bottom;
  animation: blink 1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* 卡片入场动画 */
.card { opacity: 0; transform: translateY(20px); transition: transform 0.2s, opacity 0.6s, border-color 0.2s; }
.card.reveal { opacity: 1; transform: translateY(0); }
.card.reveal:hover { transform: translateY(-4px); }

/* 复制邮箱按钮 */
.copy-email-btn {
  display: inline-block;
  margin-top: 8px;
  padding: 6px 14px;
  background: transparent;
  border: 1px solid #326182;
  color: #326182;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  transition: background 0.2s, color 0.2s;
}
.copy-email-btn:hover { background: #326182; color: #fff; }
.copy-email-btn.copied { background: #22a559; border-color: #22a559; color: #fff; }

/* Toast 提示 */
.toast {
  position: fixed;
  left: 50%;
  bottom: 40px;
  transform: translateX(-50%) translateY(20px);
  background: rgba(0,0,0,0.8);
  color: #fff;
  padding: 10px 20px;
  border-radius: 6px;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s, transform 0.3s;
  z-index: 100;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 烟花 canvas */
#fireworks-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 99;
}

/* 在线状态指示灯 */
.online-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: #22a559;
  border-radius: 50%;
  margin-right: 6px;
  animation: pulse 2s infinite;
  vertical-align: middle;
}
@keyframes pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34,165,89,0.5); }
  50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(34,165,89,0); }
}

/* 暗色主题下的小功能适配 */
body.dark .copy-email-btn { border-color: #7FB3D5; color: #7FB3D5; }
body.dark .copy-email-btn:hover { background: #7FB3D5; color: #111; }
</style>
</head>

<!-- 老 IE 升级提示，现代浏览器完全忽略 -->

<script>
(function () {
  var btn = document.getElementById('themeBtn');
  if (!btn) return;

  function hasClass(el, cls) {
    if (el.classList) return el.classList.contains(cls);
    return (' ' + el.className + ' ').indexOf(' ' + cls + ' ') > -1;
  }
  function addClass(el, cls) {
    if (el.classList) { el.classList.add(cls); return; }
    if (!hasClass(el, cls)) el.className += (el.className ? ' ' : '') + cls;
  }
  function removeClass(el, cls) {
    if (el.classList) { el.classList.remove(cls); return; }
    el.className = (' ' + el.className + ' ').replace(' ' + cls + ' ', ' ').replace(/^\s+|\s+$/g, '');
  }
  function toggleClass(el, cls) {
    if (hasClass(el, cls)) removeClass(el, cls); else addClass(el, cls);
  }

  function getTheme() {
    try { return window.localStorage ? localStorage.getItem('theme') : null; }
    catch (e) { return null; }
  }
  function setTheme(v) {
    try { if (window.localStorage) localStorage.setItem('theme', v); }
    catch (e) {}
  }

  if (getTheme() === 'dark') addClass(document.body, 'dark');

  function updateIcon() {
    btn.innerHTML = hasClass(document.body, 'dark') ? '☀️' : '🌙';
  }
  updateIcon();

  btn.onclick = function () {
    toggleClass(document.body, 'dark');
    setTheme(hasClass(document.body, 'dark') ? 'dark' : 'light');
    updateIcon();
  };
})();

/* ===== 新增：Toast 提示 ===== */
(function () {
  var toastEl = document.getElementById('toast');
  var timer = null;
  window.showToast = function (msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () { toastEl.classList.remove('show'); }, 2000);
  };
})();

/* ===== 新增：访客计数器 ===== */
(function () {
  var localEl = document.getElementById('localVisits');

  /* 本地计数（localStorage，离线可用） */
  var localCount = 1;
  try {
    var prev = parseInt(localStorage.getItem('mdy_visit_count') || '0', 10);
    localCount = prev + 1;
    localStorage.setItem('mdy_visit_count', String(localCount));
  } catch (e) {}
  if (localEl) {
    // 数字滚动动画
    var display = 0;
    var step = Math.max(1, Math.ceil(localCount / 20));
    var animTimer = setInterval(function () {
      display += step;
      if (display >= localCount) { display = localCount; clearInterval(animTimer); }
      localEl.textContent = display.toLocaleString();
    }, 40);
  }

  /* 全局计数：hits.sh SVG 已嵌入页面，每次访问自动 +1
     用 img 标签加载，无需 JS 解析，离线也能看到缓存的 badge */
  var badge = document.getElementById('globalBadge');
  if (badge) {
    badge.onerror = function () {
      // 离线时显示文字提示
      var item = badge.closest('.item');
      if (item) {
        item.innerHTML = '<span class="icon">👀</span><span>离线模式</span>';
      }
    };
  }
})();

/* ===== 新增：动态背景加载 ===== */
(function () {
  var bgImg = document.getElementById('bg-image');
  var bgLoader = document.getElementById('bg-loader');
  var bgRefreshBtn = document.getElementById('bgRefreshBtn');
  var apiUrl = 'https://api.yppp.net/api.php';
  if (!bgImg) return;

  function loadBg(showLoader) {
    if (showLoader && bgLoader) {
      bgLoader.classList.add('show');
    }
    // 加随机参数防缓存，确保每次拿到不同图片
    var url = apiUrl + '?t=' + Date.now();
    var img = new Image();
    img.onload = function () {
      bgImg.src = url;
      // 等图片完全加载后再显示（触发 CSS transition）
      setTimeout(function () {
        bgImg.classList.add('loaded');
      }, 100);
      if (bgLoader) bgLoader.classList.remove('show');
    };
    img.onerror = function () {
      if (bgLoader) bgLoader.classList.remove('show');
      console.log('背景图片加载失败，使用默认渐变背景');
    };
    img.src = url;
  }

  // 页面加载时自动加载背景
  window.addEventListener('load', function () {
    loadBg(true);
  });

  // 刷新按钮
  if (bgRefreshBtn) {
    bgRefreshBtn.onclick = function (e) {
      e.stopPropagation();
      // 先淡出
      bgImg.classList.remove('loaded');
      setTimeout(function () { loadBg(true); }, 400);
    };
  }
})();

(function () {
  var el = document.getElementById('typed-text');
  if (!el) return;
  var texts = [
    '一个热衷于捣鼓蜜汁の小代码的神人',
    'Hello, I am mdy',
    'Vibe coding, 快乐加倍 ✨',
    '今天也要敲代码鸭 🦆'
  ];
  var ti = 0, ci = 0, deleting = false;

  function tick() {
    var cur = texts[ti];
    if (!deleting) {
      ci++;
      el.textContent = cur.substring(0, ci);
      if (ci >= cur.length) {
        deleting = true;
        setTimeout(tick, 1800); // 停留 1.8s
        return;
      }
      setTimeout(tick, 90 + Math.random() * 60);
    } else {
      ci--;
      el.textContent = cur.substring(0, ci);
      if (ci <= 0) {
        deleting = false;
        ti = (ti + 1) % texts.length;
        setTimeout(tick, 400);
        return;
      }
      setTimeout(tick, 35);
    }
  }
  setTimeout(tick, 500);
})();

/* ===== 新增：卡片入场动画（IntersectionObserver） ===== */
(function () {
  var cards = document.querySelectorAll('.card');
  if (!('IntersectionObserver' in window) || cards.length === 0) {
    // 降级：直接显示
    cards.forEach(function (c) { c.style.opacity = 1; c.style.transform = 'none'; });
    return;
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry, i) {
      if (entry.isIntersecting) {
        setTimeout(function () { entry.target.classList.add('reveal'); }, i * 120);
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  cards.forEach(function (c) { io.observe(c); });
})();

/* ===== 新增：复制邮箱 ===== */
(function () {
  var btn = document.getElementById('copyEmailBtn');
  var text = document.getElementById('email-text');
  if (!btn || !text) return;

  function fallbackCopy(txt) {
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('✅ 邮箱已复制到剪贴板'); btn.classList.add('copied'); btn.textContent = '已复制'; setTimeout(function () { btn.classList.remove('copied'); btn.textContent = '复制邮箱'; }, 2000); }
    catch (e) { showToast('复制失败，请手动复制'); }
    document.body.removeChild(ta);
  }

  btn.onclick = function () {
    var email = text.textContent.trim();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(email).then(function () {
        showToast('✅ 邮箱已复制到剪贴板');
        btn.classList.add('copied'); btn.textContent = '已复制';
        setTimeout(function () { btn.classList.remove('copied'); btn.textContent = '复制邮箱'; }, 2000);
      }).catch(function () { fallbackCopy(email); });
    } else {
      fallbackCopy(email);
    }
  };
})();

/* ===== 新增：点击烟花彩蛋 ===== */
(function () {
  var canvas = document.getElementById('fireworks-canvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var particles = [];
  var rafId = null;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function hexToRgb(hex) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return [r, g, b];
  }

  function burst(x, y) {
    var colors = ['#326182', '#7FB3D5', '#22a559', '#f5a623', '#e74c3c', '#9b59b6', '#1abc9c'];
    var count = 30 + Math.floor(Math.random() * 20);
    for (var i = 0; i < count; i++) {
      var angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      var speed = 2 + Math.random() * 5;
      var color = colors[Math.floor(Math.random() * colors.length)];
      particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.008 + Math.random() * 0.012,
        color: color,
        size: 1.5 + Math.random() * 2
      });
    }
    if (!rafId) animate();
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.08;        // 重力
      p.vx *= 0.99;
      p.vy *= 0.99;
      p.life -= p.decay;
      if (p.life <= 0) { particles.splice(i, 1); continue; }

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (particles.length > 0) {
      rafId = requestAnimationFrame(animate);
    } else {
      rafId = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  // 暴露到全局，供彩虹模式调用
  window.burst = burst;

  // 点击 / 触摸触发
  document.addEventListener('click', function (e) {
    // 不在按钮/链接上触发
    var tag = e.target.tagName;
    if (tag === 'BUTTON' || tag === 'A' || tag === 'CANVAS') return;
    burst(e.clientX, e.clientY);
  });

  // 页面加载后自动放一朵烟花，展示彩蛋
  window.addEventListener('load', function () {
    setTimeout(function () {
      burst(window.innerWidth / 2, window.innerHeight * 0.35);
    }, 1200);
  });
})();

/* 连点 7 次主题按钮 → 彩虹模式 */
var themeBtn = document.getElementById('themeBtn');
var clickCount = 0, clickTimer = null;
if (themeBtn) {
  themeBtn.addEventListener('click', function () {
    clickCount++;
    if (clickTimer) clearTimeout(clickTimer);
    clickTimer = setTimeout(function () { clickCount = 0; }, 2500);
    if (clickCount >= 7) {
      clickCount = 0;
      enableRainbow();
    }
  });
}

function enableRainbow() {
  if (window.showToast) window.showToast('🌈 彩虹模式已开启！再点一次关闭');
  document.body.classList.toggle('rainbow');
  if (document.body.classList.contains('rainbow')) {
    // 动态背景：随机颜色循环
    var colors = ['#ff6b6b', '#feca57', '#48dbfb', '#1dd1a1', '#5f27cd', '#ee5253', '#ff9ff3'];
    var ci = 0;
    if (window._rainbowTimer) clearInterval(window._rainbowTimer);
    window._rainbowTimer = setInterval(function () {
      ci = (ci + 1) % colors.length;
      document.body.style.transition = 'background 1s ease';
      document.body.style.background = colors[ci];
    }, 1200);
    // 烟花派对
    for (var i = 0; i < 6; i++) {
      (function (delay) {
        setTimeout(function () {
          burst(Math.random() * window.innerWidth, Math.random() * window.innerHeight * 0.7);
        }, delay);
      })(i * 400);
    }
  } else {
    document.body.style.background = '';
    document.body.style.transition = '';
    if (window._rainbowTimer) { clearInterval(window._rainbowTimer); window._rainbowTimer = null; }
  }
}
// 暴露给全局
window._rainbowEnabled = false;
