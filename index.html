<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="description" content="mdy 的个人主页">
<title>mdy</title>
<style>
/* ===== 基础变量（现代浏览器生效，老浏览器忽略） ===== */
:root {
  --primaryColor: #326182;
  --backgroundLight: #FAFAFB;
  --backgroundMiddle: #f5f5f5;
  --backgroundMain: #DEE2E6;
  --textDark: #2C2F33;
  --dividerColor: #E9ECEF;
  --headerBarColor: #C8DBE8;        /* 由原半透明色与底色混合算出的不透明近似值 */
  --borderRadius: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

/* ===== 基础样式：所有浏览器都能懂 ===== */
body {
  background: #DEE2E6;
  color: #2C2F33;
  font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh;
}

/* 顶栏：纯色，无毛玻璃，无实时合成 */
.headerBar {
  padding: 12px 24px;
  background: #C8DBE8;
  position: fixed;                  /* 比 sticky 便宜，且不随内容重算 */
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  overflow: hidden;
}
.headerBar .logo {
  float: left;
  font-size: 18px;
  font-weight: bold;
  letter-spacing: 1px;
  line-height: 32px;
}
.headerBar .themeBtn {
  float: right;
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 6px;
  border-radius: 50%;
  font-size: 16px;
  line-height: 20px;
}
.headerBar .themeBtn:hover { background: rgba(0,0,0,0.08); }
.headerBar::after { content: ""; display: block; clear: both; }

/* 给固定顶栏留出空间，避免内容被遮住 */
.page {
  padding-top: 56px;
}

/* Hero */
.hero {
  text-align: center;
  padding: 80px 20px 60px;
}
.hero h1 { font-size: 36px; margin-bottom: 12px; }
.hero p { color: #666; font-size: 16px; }

/* 卡片区：老浏览器 inline-block 居中，现代浏览器 flex */
.cards {
  text-align: center;
  padding: 20px 40px 60px;
  max-width: 1000px;
  margin: 0 auto;
  font-size: 0;
}
.card {
  display: inline-block;
  vertical-align: top;
  text-align: left;
  background: #FAFAFB;
  border: 1px solid #E9ECEF;        /* 用边框替代阴影，零模糊开销 */
  border-radius: 8px;
  padding: 24px;
  width: 240px;
  max-width: 100%;
  margin: 10px;
  font-size: 14px;
  transition: transform 0.2s;       /* 只保留便宜的 transform 过渡 */
}
.card:hover { transform: translateY(-4px); }
.card h3 { margin-bottom: 8px; color: #326182; }
.card p { font-size: 14px; color: #555; line-height: 1.6; }
.card a { color: #326182; text-decoration: none; }
.card a:hover { text-decoration: underline; }

/* 友链 */
.friendLinks {
  text-align: center;
  padding: 20px 20px 0;
  font-size: 14px;
  color: #666;
}
.friendLinks a {
  color: #326182;
  text-decoration: none;
  border-bottom: 1px dashed #326182;
}
.friendLinks a:hover { opacity: 0.75; }

/* 页脚 */
.footer {
  text-align: center;
  padding: 30px;
  color: #888;
  font-size: 13px;
  border-top: 1px solid #E9ECEF;
  margin-top: 20px;
}

/* 升级提示条：只在 IE8 及以下显示 */
.ie-warning {
  display: none;
  background: #ffe0e0;
  color: #900;
  text-align: center;
  padding: 12px;
  font-size: 14px;
}

/* ===== 现代浏览器增强 ===== */
@supports (display: flex) {
  .headerBar {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .headerBar .logo,
  .headerBar .themeBtn { float: none; }
  .headerBar::after { display: none; }

  .cards {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    font-size: 14px;
  }
  .card { margin: 0; }
}

/* ===== 暗色主题：变量生效的浏览器才有 ===== */
@supports (--css: variables) {
  body {
    background: var(--backgroundMain);
    color: var(--textDark);
  }
  .headerBar { background: var(--headerBarColor); }
  .card {
    background: var(--backgroundLight);
    border-radius: var(--borderRadius);
  }
  .card h3, .card a { color: var(--primaryColor); }
  .friendLinks a { color: var(--primaryColor); border-bottom-color: var(--primaryColor); }
  .footer { border-top-color: var(--dividerColor); }

  body.dark {
    --primaryColor: #7FB3D5;
    --backgroundMain: #111111;
    --backgroundMiddle: #1a1a1a;
    --backgroundLight: #282828;
    --textDark: #FFFFFF;
    --headerBarColor: #0B2A6B;
    --dividerColor: #404040;
  }
  body.dark .hero p,
  body.dark .card p { color: #aaa; }
  body.dark .friendLinks { color: #aaa; }
  body.dark .footer { color: #666; }
}
</style>
</head>
<body>

<!-- 老 IE 升级提示，现代浏览器完全忽略 -->
<!--[if lte IE 8]>
<div class="ie-warning">
  你的浏览器版本过旧，网页可能无法正常显示。建议升级到最新版 Chrome、Edge 或 Firefox。
</div>
<![endif]-->

<div class="headerBar">
  <div class="logo">MDY's page</div>
  <button class="themeBtn" id="themeBtn" title="切换主题">🌙</button>
</div>

<div class="page">
  <div class="hero">
    <h1>你好，我是 mdy</h1>
    <p>一个热衷于捣鼓蜜汁の小代码的神人</p>
  </div>

  <div class="cards">
    <div class="card">
      <h3>关于我</h3>
      <p>不知道咋填</p>
    </div>
    <div class="card">
      <h3>技能</h3>
      <p>写点凑代码，一般是直接 vibe coding，ai 太好用辣</p>
    </div>
    <div class="card">
      <h3>联系方式</h3>
      <p>mdy114514mdy@outlook.com</p>
    </div>
  </div>

  <div class="friendLinks">
    <span>友链：</span>
    <a href="https://mhanwen.github.io" target="_blank" rel="noopener">mhanwen</a>
  </div>

  <div class="footer">
    © 2026 MDY · 用 ❤️ 制作
  </div>
</div>

<script>
(function () {
  var btn = document.getElementById('themeBtn');
  if (!btn) return;

  function hasClass(el, cls) {
    if (el.classList) return el.classList.contains(cls);
    return (' ' + el.className + ' ').indexOf(' ' + cls + ' ') > -1;
  }
  function addClass(el, cls) {
    if (el.classList) { el.classList.add(cls); return; }
    if (!hasClass(el, cls)) el.className += (el.className ? ' ' : '') + cls;
  }
  function removeClass(el, cls) {
    if (el.classList) { el.classList.remove(cls); return; }
    el.className = (' ' + el.className + ' ').replace(' ' + cls + ' ', ' ').replace(/^\s+|\s+$/g, '');
  }
  function toggleClass(el, cls) {
    if (hasClass(el, cls)) removeClass(el, cls); else addClass(el, cls);
  }

  function getTheme() {
    try { return window.localStorage ? localStorage.getItem('theme') : null; }
    catch (e) { return null; }
  }
  function setTheme(v) {
    try { if (window.localStorage) localStorage.setItem('theme', v); }
    catch (e) {}
  }

  if (getTheme() === 'dark') addClass(document.body, 'dark');

  function updateIcon() {
    btn.innerHTML = hasClass(document.body, 'dark') ? '☀️' : '🌙';
  }
  updateIcon();

  btn.onclick = function () {
    toggleClass(document.body, 'dark');
    setTheme(hasClass(document.body, 'dark') ? 'dark' : 'light');
    updateIcon();
  };
})();
</script>

</body>
</html>
